<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vigil Status</title>
  <style>
    body {
      width: 320px;
      margin: 0;
      padding: 20px;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
    }

    .header {
      display: flex;
      align-items: center;
      margin-bottom: 24px;
    }

    .logo {
      width: 32px;
      height: 32px;
      margin-right: 12px;
    }

    .title {
      font-size: 18px;
      font-weight: 700;
      margin: 0;
      letter-spacing: -0.5px;
    }

    .status-card {
      background-color: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 24px;
    }

    .status-header {
      display: flex;
      align-items: center;
      margin-bottom: 8px;
    }

    .status-indicator {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background-color: #10b981;
      /* Emerald 500 */
      margin-right: 8px;
      box-shadow: 0 0 10px rgba(16, 185, 129, 0.4);
    }

    .status-text {
      font-size: 14px;
      font-weight: 600;
      color: #e2e8f0;
      margin: 0;
    }

    .status-desc {
      font-size: 13px;
      color: #94a3b8;
      margin: 0;
      line-height: 1.5;
    }

    .action-btn {
      display: block;
      width: 100%;
      padding: 12px;
      background-color: #06b6d4;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      text-align: center;
      text-decoration: none;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .action-btn:hover {
      background-color: #0891b2;
    }
  </style>
</head>

<body>
  <div class="header">
    <img src="icon48.png" alt="Vigil Logo" class="logo">
    <h1 class="title">Vigil Security</h1>
  </div>

  <div class="status-card">
    <div class="status-header">
      <div id="status-dot" class="status-indicator"></div>
      <h2 id="status-title" class="status-text">Active & Monitoring</h2>
    </div>
    <p id="status-desc" class="status-desc">Vigil is analyzing URLs in the background.</p>
  </div>

  <div id="result-container" style="display: none; background-color: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 16px; margin-bottom: 24px; text-align: center;">
    <div id="result-score" style="font-size: 32px; font-weight: 800; margin-bottom: 4px;">--/100</div>
    <div id="result-severity" style="font-size: 14px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 12px;">UNKNOWN</div>
    <a href="#" id="view-report-btn" class="action-btn" style="display: none; margin-top: 12px;">View Full Report</a>
  </div>

  <a href="http://localhost:5173" target="_blank" id="dashboard-link" class="action-btn" style="background-color: transparent; border: 1px solid #334155; color: #cbd5e1;">Open Dashboard</a>

  <script type="module" src="popup.js"></script>
</body>

</html>
