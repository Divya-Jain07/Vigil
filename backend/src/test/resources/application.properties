# Test-specific property overrides.
# These values are used by the Spring Boot integration test (BackendApplicationTests)
# to load the application context without requiring real credentials.

spring.data.mongodb.uri=mongodb://localhost:27017/vigil-test

# External Threat Intelligence (test values — clients skip gracefully when key is blank)
vigil.virustotal.api-key=
vigil.virustotal.base-url=https://www.virustotal.com/api/v3
vigil.urlscan.api-key=
vigil.urlscan.base-url=https://urlscan.io/api/v1
vigil.rdap.base-url=https://rdap.org

# Gemini AI (test value — client skips gracefully when key is blank)
vigil.gemini.api-key=
vigil.gemini.base-url=https://generativelanguage.googleapis.com/v1beta
vigil.gemini.model=gemini-1.5-flash
