spring.application.name=backend
spring.data.mongodb.uri=${MONGODB_URI}

# External Threat Intelligence
vigil.virustotal.api-key=${VIRUSTOTAL_API_KEY:}
vigil.virustotal.base-url=https://www.virustotal.com/api/v3
vigil.urlscan.api-key=${URLSCAN_API_KEY:}
vigil.urlscan.base-url=https://urlscan.io/api/v1
vigil.rdap.base-url=https://rdap.org

# Gemini AI
vigil.gemini.api-key=${GEMINI_API_KEY:}
vigil.gemini.base-url=https://generativelanguage.googleapis.com/v1beta
vigil.gemini.model=gemini-flash-latest

# JWT Authentication
vigil.jwt.secret=${JWT_SECRET}
vigil.jwt.expiration=86400000

# File Upload Limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB